[project]
name = "mibigxfinder"
version = "0.0.1"
description = "Match MS/MS spectra and chemical structures against a MIBiG-linked library."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rosina Torres Ortega", email = "rosina.torresortega@wur.nl" },
    { name = "Annette Lien", email = "annette.lien@wur.nl" },
    { name = "Joana Tirana", email = "joana.tirana@wur.nl" },
]
keywords = ["mibig", "mass-spectrometry", "metabolomics", "natural-products", "matchms"]
# BiG-SCAPE 2.0.3 is also required, but it is only on bioconda: see environment.yml
dependencies = [
    "matchms>=1.0",
    "rdkit>=2024.3",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.scripts]
mibigxfinder = "mibigxfinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mibigxfinder"]